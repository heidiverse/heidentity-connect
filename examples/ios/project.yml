name: OidcSample

options:
  bundleIdPrefix: org.heidiverse.connect.sdk
  deploymentTarget:
    iOS: "17.4"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    KOTLIN_SWIFT_EXPORT_TARGET[sdk=iphoneos*]: iosArm64
    KOTLIN_SWIFT_EXPORT_TARGET[sdk=iphonesimulator*]: iosSimulatorArm64
    KOTLIN_SHARED_BUILD_DIR: $(SRCROOT)/../shared/build
  configs:
    Debug:
      KOTLIN_SWIFT_EXPORT_BUILD_TYPE: Debug
    Release:
      KOTLIN_SWIFT_EXPORT_BUILD_TYPE: Release

targets:
  OidcSample:
    type: application
    platform: iOS
    sources:
      - path: OidcSample
        type: syncedFolder
      - path: ../shared/src
        type: folder
        group: SharedKMP
        buildPhase: none
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Connect Sample
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          # Used by the redirect URI of the browser login (host "oidc") and the native callback URI of the App2App login
          # (host "app2app", see SampleApp2AppConfig.DEFAULT_NATIVE_CALLBACK_URI)
          - CFBundleURLName: org.heidiverse.connect.sdk.sample
            CFBundleURLSchemes: [org.heidiverse.connect.sdk.sample]
        # App2App: to detect whether the user-interacting app is installed, list the custom scheme of its deep link
        # here (or the one from SampleApp2AppConfig.customSchemeLookup if its deep link is a universal link)
        # LSApplicationQueriesSchemes: [com.example.authenticator]
    entitlements:
      path: OidcSample.entitlements
      properties:
        # HTTPS redirect URIs are only delivered to ASWebAuthenticationSession if their host is a webcredentials
        # associated domain. mode=developer fetches the apple-app-site-association file directly from the host instead
        # of Apple's CDN, see examples/ios/README.md
        com.apple.developer.associated-domains:
          - webcredentials:$(OIDC_REDIRECT_HOST)?mode=developer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.heidiverse.connect.sdk.sample
        CODE_SIGN_STYLE: Automatic
        # Set your team to run on a device, the associated domains capability requires a provisioning profile
        DEVELOPMENT_TEAM: ""
        # Host of the HTTPS redirect URI configured in the app
        OIDC_REDIRECT_HOST: app.example.com
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(KOTLIN_SHARED_BUILD_DIR)/SPMBuild/$(KOTLIN_SWIFT_EXPORT_TARGET)/$(KOTLIN_SWIFT_EXPORT_BUILD_TYPE)/dd-a-files/libOidcSampleSharedLibrary.a"
          - "$(KOTLIN_SHARED_BUILD_DIR)/bin/$(KOTLIN_SWIFT_EXPORT_TARGET)/SwiftExportBinary$(KOTLIN_SWIFT_EXPORT_BUILD_TYPE)Static/libSwiftExportBinary.a"
        SWIFT_INCLUDE_PATHS:
          - "$(inherited)"
          - "$(KOTLIN_SHARED_BUILD_DIR)/SPMBuild/$(KOTLIN_SWIFT_EXPORT_TARGET)/$(KOTLIN_SWIFT_EXPORT_BUILD_TYPE)/dd-interfaces"
    preBuildScripts:
      - name: Compile KMP
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          /bin/sh "$SRCROOT/Scripts/build_kmp_swift_export.sh"

schemes:
  OidcSample:
    build:
      targets:
        OidcSample: all
    run:
      config: Debug
    archive:
      config: Release
